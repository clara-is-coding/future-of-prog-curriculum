site:
  title: "How to prepare for the future of programming"
  # GitHub Pages serves the site at https://clara-is-coding.github.io/future-of-prog-curriculum/
  basePath: "future-of-prog-curriculum"

server:
  files:
    dev:
      contentRoot: "build/processedResources/js/main/public"
      script: "build/kotlin-webpack/js/developmentExecutable/app.js"
      api: "build/libs/app.jar"
    prod:
      script: "build/kotlin-webpack/js/productionExecutable/app.js"
      siteRoot: ".kobweb/site"

  port: 8080
